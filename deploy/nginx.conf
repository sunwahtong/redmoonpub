# Red Moon Pub behind nginx. deploy/install.sh installs it as
# /etc/nginx/sites-available/redmoon with __DOMAIN__ filled in; certbot then
# adds the TLS listener and the redirect from http.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # JSON bodies are capped at 1 MB by the app; pictures go straight to Cloudinary.
    client_max_body_size 2m;

    # The map tile pack straight from disk: 4098 small files that never change.
    location /assets/map/ {
        alias /opt/redmoon/map-tiles/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Only this proxy may name the client: the app reads these headers first.
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_read_timeout 60s;
    }
}
