# Render Blueprint: one free web service running the long-lived Node server
# (API + built site + map tiles), against the existing Supabase database and
# Cloudinary account. Nothing else is created here: Render's free Postgres is
# deleted after 30 days, so the database stays on Supabase.
#
# Secrets (sync: false) are entered once in the Render dashboard when the
# Blueprint is applied. VITE_* values are baked into the bundle at build time,
# so they must be present before the first build.
services:
  - type: web
    name: red-moon-pub
    runtime: node
    plan: free
    region: frankfurt
    # NODE_ENV=production makes npm skip devDependencies, and the build needs
    # vite + typescript from there. NPM_CONFIG_PRODUCTION=false keeps them.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NODE_VERSION
        value: "24"
      # Supabase → Project Settings → Database → Connection string (session pooler, port 5432).
      - key: DATABASE_URL
        sync: false
      # Supabase → Project Settings → API keys.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Cloudinary → Dashboard → API keys.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: redmoon
      - key: VITE_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: VITE_CLOUDINARY_FOLDER
        value: redmoon
      # Where the map tiles are served from (a Cloudflare Pages project, see
      # README → Map tiles). Empty serves them from this service.
      - key: VITE_MAP_TILE_BASE
        sync: false
